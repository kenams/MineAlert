name: Refresh market data

# La page d'accueil lit les cours via getMinerals(), qui déclenche la synchronisation
# quand les données ont plus de 15 minutes. Cet appel régulier la garde à jour sans visiteur.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the landing page (ISR + on-demand sync)
        run: curl -fsS --max-time 60 https://mine-alert-kenams.vercel.app/ -o /dev/null
      - name: Run scheduled jobs (SEC filings, country risk, alerts, digest)
        env:
          JOBS_TICK_TOKEN: ${{ secrets.JOBS_TICK_TOKEN }}
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer $JOBS_TICK_TOKEN" https://mine-alert-kenams.vercel.app/api/jobs/tick
      - name: Check freshness
        run: |
          curl -fsS --max-time 30 https://mine-alert-kenams.vercel.app/api/system/status | tee status.json
          grep -q '"freshnessStatus":"unavailable"' status.json && echo "::warning::no market data yet" || true
